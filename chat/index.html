<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat UNAB · Prueba</title>
<style>
  :root{--u:#0a3d91;--a:#f5a623;--bg:#eef3fb;--ink:#17233a}
  *{box-sizing:border-box;font-family:Segoe UI,system-ui,sans-serif}
  body{margin:0;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;background:linear-gradient(100deg,var(--u),#1565c0);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #0002}
  header .logo{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--u);display:grid;place-items:center;font-weight:800}
  header h1{font-size:17px;margin:0}
  header small{opacity:.85;display:block;font-size:11px}
  .tabs{display:flex;gap:6px;padding:10px;flex-wrap:wrap;justify-content:center}
  .tabs button{border:1px solid #c9d6ea;background:#fff;color:var(--u);padding:7px 12px;border-radius:18px;cursor:pointer;font-size:13px}
  .tabs button.act{background:var(--u);color:#fff;border-color:var(--u)}
  #chat{width:min(760px,96vw);flex:1;overflow:auto;background:#fff;border-radius:14px 14px 0 0;padding:18px;box-shadow:0 -2px 16px #0001;margin-top:4px}
  .msg{margin:0 0 12px;max-width:82%;padding:10px 14px;border-radius:14px;line-height:1.45;white-space:pre-wrap;font-size:14px}
  .user{background:var(--u);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .bot{background:#f0f4fa;border:1px solid #dfe7f3;border-bottom-left-radius:4px}
  .bot b{color:var(--u)}
  .hint{color:#7b8798;font-size:12px;text-align:center;margin:6px 0 14px}
  #form{width:min(760px,96vw);display:flex;gap:8px;padding:12px;background:#fff;border-radius:0 0 14px 14px;box-shadow:0 2px 16px #0001}
  #q{flex:1;padding:12px 14px;border:1px solid #c9d6ea;border-radius:10px;font-size:15px;outline:none}
  #q:focus{border-color:var(--u)}
  #send{background:var(--a);color:#3b2600;border:0;border-radius:10px;padding:0 20px;font-weight:700;cursor:pointer}
  #send:disabled{opacity:.5;cursor:wait}
  .sug{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 10px 8px}
  .sug button{font-size:12px;background:#fff8e8;border:1px solid #f0d49a;color:#7a5300;border-radius:14px;padding:5px 10px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="logo">U</div>
  <div><h1>UNAB · Apoyo Académico</h1><small>Conectado a n8n Cloud · datos sintéticos</small></div>
</header>
<div class="tabs">
  <button class="act" data-m="rag">💬 Asistente UNAB</button>
  <button data-m="cal">📅 Calendario</button>
  <button data-m="aca">🎓 Mi avance</button>
</div>
<div class="sug">
  <button>¿Cuáles son los requisitos de grado?</button>
  <button>¿Qué prerrequisitos bloquean Cálculo Multivariado?</button>
  <button>¿Cuándo son los exámenes finales?</button>
  <button>¿Cuál es mi promedio?</button>
</div>
<div id="chat">
  <div class="hint">Escribe tu pregunta y presiona Enter 👇</div>
</div>
<form id="form">
  <input id="q" autocomplete="off" placeholder="Escribe tu pregunta sobre la UNAB..." autofocus>
  <button id="send">Enviar</button>
</form>
<script>
const BASE='https://unab-chatbot.app.n8n.cloud';
const RUTAS={rag:'/webhook/unab/rag',cal:'/webhook/unab/calendario',aca:'/webhook/unab/academico'};
const NOMBRES={rag:'Asistente UNAB',cal:'Calendario',aca:'Mi avance'};
let modo='rag';
const session='web-demo-'+Math.random().toString(36).slice(2,10);
const chat=document.getElementById('chat'), q=document.getElementById('q'), send=document.getElementById('send');
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  modo=b.dataset.m;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('act',x===b));
  q.placeholder='Pregunta para '+NOMBRES[modo]+'...';
  q.focus();
});
document.querySelectorAll('.sug button').forEach(b=>b.onclick=()=>{q.value=b.textContent;q.focus()});
function add(who,text){
  const d=document.createElement('div');d.className='msg '+who;d.textContent=text;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
async function preguntar(texto){
  if(!texto.trim())return;
  add('user',texto);q.value='';send.disabled=true;
  const esperando=add('bot','Pensando…');
  const body={session_id:session,pregunta:texto,id_estudiante:'10045234',canal:'web-demo'};
  try{
    const r=await fetch(BASE+RUTAS[modo],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await r.json();
    esperando.textContent=(data.respuesta||data.error||'Sin respuesta')+(data.latencia_ms?'\n\n· '+(data.latencia_ms/1000).toFixed(1)+' s':'');
  }catch(e){esperando.textContent='No pude conectar con n8n: '+e.message}
  finally{send.disabled=false;q.focus()}
}
document.getElementById('form').onsubmit=e=>{e.preventDefault();preguntar(q.value)};
</script>
</body>
</html>
